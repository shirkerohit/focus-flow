<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stay Focused — FocusFlow</title>
<style>
  :root { --accent:#6c63f0; --bg:#f5f5fb; --card:#fff; --text:#23233b; --dim:#71718a; --border:rgba(35,35,59,.08); }
  @media (prefers-color-scheme: dark){ :root{ --bg:#17171f; --card:#212129; --text:#ececf3; --dim:#9a9ab0; --border:rgba(236,236,243,.08);} }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.08);max-width:520px;width:100%;padding:32px;text-align:center}
  .icon{width:56px;height:56px;background:var(--accent);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px}
  h1{font-size:22px;font-weight:700;margin-bottom:8px}
  .host{color:var(--accent);font-weight:700}
  p{color:var(--dim);font-size:14px;line-height:1.6;margin-bottom:6px}
  .remain{display:inline-block;background:rgba(108,99,240,.12);color:var(--accent);font-weight:700;padding:6px 12px;border-radius:999px;font-size:13px;margin:14px 0 18px}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{border:none;font:inherit;font-weight:600;padding:12px 18px;border-radius:12px;cursor:pointer;transition:transform .1s,filter .15s,opacity .15s}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .primary{background:var(--accent);color:#fff;min-width:160px}
  .secondary{background:transparent;border:1.5px solid var(--border);color:var(--text);min-width:120px}
  .link{margin-top:16px;display:inline-block;font-size:12.5px;color:var(--dim);text-decoration:none;cursor:pointer;border:none;background:none;font:inherit}
  .link:hover{color:var(--accent);text-decoration:underline}
  .tiny{font-size:11px;color:var(--dim);margin-top:14px}
  .home-link{margin-top:10px;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);text-decoration:none;font-weight:600}
  .home-link:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🎯</div>
    <h1>Stay in flow</h1>
    <p><span class="host" id="host">this site</span> is blocked while you focus.</p>
    <p id="url-preview" style="font-size:12px;word-break:break-all;opacity:.7"></p>
    <div class="remain" id="remain">Focus session running</div>
    <div class="actions">
      <button class="btn secondary" id="btn-back">← Go back</button>
      <button class="btn primary" id="btn-allow">Continue for 5 min</button>
    </div>
    <button class="link" id="btn-disable">Disable for this site this session</button>
    <div><a class="home-link" id="btn-home" href="#">✨ Open Focus Home →</a></div>
    <div class="tiny">FocusFlow site blocker • You chose to focus with intention. You've got this.</div>
  </div>
<script src="blocked.js"></script>
</body>
</html>
